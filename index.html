<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nora Filmus — Actriz, productora y pedagoga teatral</title>
    <!-- Descripción para buscadores y para la tarjeta que se ve al compartir el
         link (LinkedIn, WhatsApp). Es lo primero que lee una productora que
         busca a Nora: va con las credenciales al frente, no con rótulos. -->
    <meta
      name="description"
      content="Actriz, productora y pedagoga teatral argentino-rumana radicada en Dublín. 36 años en artes escénicas: teatro independiente, producción para cine y TV, y coordinación de programas de formación artística."
    />

    <!-- Dominio de producción: norafilmus.com (confirmado por el usuario
         2026-09-06). Único lugar donde vive como string — canonical, og:url,
         sitemap.xml (scripts/generate-sitemap.mjs) y el JSON-LD de abajo lo
         referencian; si el dominio cambia algún día, actualizar acá primero. -->
    <link rel="canonical" href="https://norafilmus.com/" />

    <meta property="og:title" content="Nora Filmus — Actriz, productora y pedagoga teatral" />
    <meta
      property="og:description"
      content="36 años en artes escénicas, entre Buenos Aires y Dublín."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://norafilmus.com/" />
    <meta property="og:site_name" content="Nora Filmus" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- Absoluta a propósito: WhatsApp/Slack/iMessage no resuelven og:image
         relativo de forma confiable (varían por cliente), a diferencia de
         Facebook/LinkedIn que sí lo hacen casi siempre. -->
    <meta property="og:image" content="https://norafilmus.com/img/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nora Filmus — actriz, productora y pedagoga teatral" />

    <!-- Twitter/X card — faltaba entero. Sin esto, X ignora las og:* de
         arriba y muestra un link pelado sin imagen. summary_large_image usa
         la misma imagen 1200×630 que ya generamos para OG. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nora Filmus — Actriz, productora y pedagoga teatral" />
    <meta
      name="twitter:description"
      content="36 años en artes escénicas, entre Buenos Aires y Dublín."
    />
    <meta name="twitter:image" content="https://norafilmus.com/img/og-image.jpg" />

    <!-- Color de la barra de navegador/status bar en Android/iOS cuando se
         agrega el sitio a la pantalla de inicio o se lo comparte — sin esto
         el navegador usa blanco por default, que desentona con el resto de
         la identidad ink/cream. -->
    <meta name="theme-color" content="#0F0E0D" />

    <!-- schema.org Person — SUPERPROMPT.md §05. Estático y en español (no
         sigue el toggle EN/ES del sitio, que es client-side): es lo que lee
         un buscador cuando indexa la página, y matchea el idioma del resto
         del HTML estático (title/description de arriba). Solo datos
         verificables contra CV/ y content.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nora Filmus",
        "url": "https://norafilmus.com/",
        "jobTitle": ["Actriz", "Productora", "Pedagoga teatral"],
        "image": "https://norafilmus.com/img/nora-portrait.webp",
        "nationality": [
          { "@type": "Country", "name": "Argentina" },
          { "@type": "Country", "name": "Romania" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dublin",
          "addressCountry": "IE"
        },
        "alumniOf": {
          "@type": "EducationalOrganization",
          "name": "Universidad Nacional de las Artes (UNA)"
        },
        "sameAs": [
          "https://www.instagram.com/noraritafilmus/",
          "https://www.linkedin.com/in/nora-filmus-ab353013/"
        ]
      }
    </script>

    <!-- Favicon: el monograma NF del logo oficial (2026-08-18) sobre ink, con
         aire alrededor — a 32px el lockup completo con "NORA FILMUS" se
         vuelve una mancha ilegible. Se generan desde
         `external-assets/brand/nf-monograma.png` con
         `scripts/generate-favicons.mjs`. Antes no había ninguno y el sitio
         devolvía 404 en cada carga (auditoría E1/H6). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- F9 (pulido, peso): la hoja de estilos de Google Fonts bloqueaba el
         primer paint (Lighthouse la midió en ~775ms) porque un
         `<link rel="stylesheet">` normal es render-blocking por definición.
         El truco `media="print"` + `onload` la baja de prioridad — el
         navegador la descarga en paralelo sin bloquear, y el `onload` la
         reactiva como hoja real apenas llega. `display=swap` en la URL ya
         evita el texto invisible mientras tanto; el `<noscript>` es el
         fallback bloqueante de siempre para el 0,1% sin JS. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Protest+Riot&family=Give+You+Glory&family=Quicksand:wght@300..700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Protest+Riot&family=Give+You+Glory&family=Quicksand:wght@300..700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-ink text-cream antialiased selection:bg-brand-red selection:text-cream">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
